name: Release

# Cuts a GitHub Release from a version tag.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag is the source of truth for the version: it sets the Flutter build
# name, while the workflow run number becomes the build number (Android
# versionCode), so every release increments without a bump commit. Release
# notes are generated from the commits since the previous tag.
#
# Required repository secrets (without them the APK cannot be installed as an
# upgrade over an earlier release — Android rejects a signature change):
#   KEYSTORE_BASE64    base64 of the release keystore (`base64 -i juno.jks`)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       password for that key

on:
  push:
    tags: ['v*']

# One release run at a time; don't cancel an in-flight publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "apk=Juno-v${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with .fvmrc so CI builds what we develop against.
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set — an unsigned build cannot be installed over a previous release."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk }}"

      - name: Publish release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Juno ${GITHUB_REF_NAME}" \
            --generate-notes \
            "build/app/outputs/flutter-apk/${{ steps.version.outputs.apk }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release-keystore.jks android/key.properties
